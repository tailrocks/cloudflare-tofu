[settings]
lockfile = true

[tools]
opentofu = "1.12.5"
rust = "1.97.1"

[tasks.init]
run = "tofu init -input=false"

[tasks.check]
run = """
cargo fmt -- --check
cargo check --bin export-dns
tofu fmt -check -recursive
tofu init -input=false
tofu validate
"""

[tasks.export-dns]
# The exporter writes `settings` blocks as JSON, which `tofu fmt -check` in the
# check task rejects. Normalize here so a fresh export is always check-clean.
run = """
op run --env-file 1password.env -- cargo run --bin export-dns
tofu fmt -recursive
"""

[tasks.plan]
run = "op run --env-file 1password.env -- tofu plan -out=termrock.tfplan"

[tasks.apply]
run = "op run --env-file 1password.env -- tofu apply termrock.tfplan"
