[analysis]
method = "static-filesystem-and-manifest-inspection"
detected = ["cargo-lockfile", "mise-present", "rust-binaries:cloudflare-tofu-tools:1", "rust-package"]
limitations = ["Project code, build scripts, task runners, and commands are never executed during analysis.", "Release, signing, registry, deployment, branch-protection, and runner-capability contracts remain explicit manual inputs."]

[workflow]
files = ["ci-main.yml", "ci-policy.yml", "ci-pr.yml", "ci-unit-opentofu.yml", "ci-unit-rust.yml", "maintenance.yml", "nightly.yml"]
notes = ["Rust verification uses Mr. Boxington 1.12.0 on providers [velnor]. GitHub-hosted jobs use its GitHub cache backend with bounded snapshot keys (a key names the toolchain/image/linker compatibility class and the hashed source state, so a new source state saves a new snapshot and retention keeps generations bounded). Local-provider jobs use an explicit local-backend setup step against the image/runner-provided local store."]

[release]
enabled = false
reason = "Release is fail-closed. Enable only after declaring immutable artifact, registry, provenance, and tag-protection policy."

[[unit]]
id = "opentofu"
label = "OpenTofu"
kind = "opentofu"
root = "."
watch = ["**/*.tf", "**/*.tofu", "**/.terraform.lock.hcl"]
pr_commands = ["tofu fmt -check -recursive -no-color", "TF_IN_AUTOMATION=1 TF_INPUT=0 tofu init -backend=false -input=false -no-color", "TF_IN_AUTOMATION=1 TF_INPUT=0 tofu validate -no-color"]
full_commands = ["tofu fmt -check -recursive -no-color", "TF_IN_AUTOMATION=1 TF_INPUT=0 tofu init -backend=false -input=false -no-color", "TF_IN_AUTOMATION=1 TF_INPUT=0 tofu validate -no-color"]
