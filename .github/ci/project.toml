velnor_pr_commands = ["mbx fmt --manifest-path 'Cargo.toml' -- --check", "mbx test --locked --all-features --package 'cloudflare-tofu-tools'", "mbx clippy --locked --profile test --all-targets --all-features --package 'cloudflare-tofu-tools' -- -D warnings"]
velnor_full_commands = ["mbx fmt --manifest-path 'Cargo.toml' -- --check", "mbx test --locked --all-features --package 'cloudflare-tofu-tools'", "mbx clippy --locked --profile test --all-targets --all-features --package 'cloudflare-tofu-tools' -- -D warnings"]
