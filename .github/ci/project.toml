notes = ["Rust verification uses Mr. Boxington 1.12.0 by default on both lanes. GitHub-hosted jobs use its GitHub cache backend with bounded snapshot keys (a key names the toolchain/image/linker compatibility class and the hashed source state, so a new source state saves a new snapshot and retention keeps generations bounded). Velnor jobs use an explicit local-backend setup step against the image/runner-provided local store."]

[release]
enabled = false
reason = "Release is fail-closed. Enable only after declaring immutable artifact, registry, provenance, and tag-protection policy."

[[unit]]
