full_commands = ["mbx fmt --manifest-path 'Cargo.toml' -- --check", "mbx clippy --locked --profile test --all-targets --all-features --package 'cloudflare-tofu-tools' -- -D warnings", "mbx test --locked --all-features --package 'cloudflare-tofu-tools'"]
phases = ["fmt", "clippy", "test"]
