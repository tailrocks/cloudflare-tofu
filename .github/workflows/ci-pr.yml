# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: CI / PR
run-name: CI / PR · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Verification scope
        required: true
        default: affected
        type: choice
        options:
          - affected
          - full
      base_sha:
        description: Git ref or SHA used as the affected-selection base
        required: false
        default: refs/heads/main
        type: string


concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  plan:
    name: "Control / Planning"
    if: ${{ (!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot'))) }}
    runs-on: [self-hosted, velnor-target-mvp]
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      units: ${{ steps.plan.outputs.units }}
      unit_ids: ${{ steps.plan.outputs.unit_ids }}
      full_units: ${{ steps.plan.outputs.full_units }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      excluded: ${{ steps.plan.outputs.excluded }}
      opentofu_matrix: ${{ steps.plan.outputs.opentofu_matrix }}
      rust_matrix: ${{ steps.plan.outputs.rust_matrix }}
      # Presence-only no-work marker: `planned_no_work` is `true` or absent,
      # never `false`. Consumers MUST branch
      # `needs.plan.outputs.planned_no_work == 'true'` for the no-work path;
      # any other value (including absent) means the plan selected work.
      planned_no_work: ${{ steps.plan.outputs.planned_no_work }}
      no_work_reason: ${{ steps.plan.outputs.no_work_reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected units
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_SCOPE_OVERRIDE: ${{ github.event.inputs.scope || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.inputs.base_sha || github.event.before || 'refs/heads/main' }}
          HEAD_SHA: ${{ github.sha }}
          VELNOR_PROVIDERS: velnor
          VELNOR_EVENT_TRUSTED: ${{ (!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot'))) && 'true' || 'false' }}
          VELNOR_EXPECTED_WORK_FILE: .velnor-ci-expected-work/expected-work.json
        run: |
          set -euo pipefail
          if [[ -z "${CI_SCOPE_OVERRIDE:-}" ]]; then unset CI_SCOPE_OVERRIDE; fi
          mkdir -p .velnor-ci-expected-work
          velnor-workflow plan --config .github/ci/project.toml

      - name: Publish expected work
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-expected-work
          path: .velnor-ci-expected-work/expected-work.json
          if-no-files-found: error
          retention-days: 7
  velnor-opentofu:
    name: "OpenTofu · OpenTofu · velnor — opentofu"
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.units, '"unit_id":"opentofu"') && ((!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot')))) }}
    needs: [plan]
    uses: ./.github/workflows/ci-unit-opentofu.yml
    with:
      unit: opentofu
      provider: velnor
      selected_units: ${{ needs.plan.outputs.units }}
      selected_unit_ids: ${{ needs.plan.outputs.unit_ids }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      plan_digest: ${{ needs.plan.outputs.plan_digest }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
      host_warm_layers: cargo
      unit_platform: linux-x64
      unit_trust: untrusted-ok
      unit_admission: velnor-trust-gated
  prepare-cargo:
    name: "Control / Prepare Cargo"
    if: ${{ !cancelled() && needs.plan.result == 'success' && (contains(needs.plan.outputs.units, '"unit_id":"rust-cloudflare-tofu-tools"')) && ((!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot')))) }}
    needs: [plan]
    uses: ./.github/workflows/ci-unit-rust.yml
    with:
      unit: rust-cloudflare-tofu-tools
      provider: control
      selected_units: ${{ needs.plan.outputs.units }}
      selected_unit_ids: ${{ needs.plan.outputs.unit_ids }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      plan_digest: ${{ needs.plan.outputs.plan_digest }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
  velnor-rust-cloudflare-tofu-tools:
    name: "Rust · cloudflare-tofu-tools · velnor — rust-cloudflare-tofu-tools"
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.prepare-cargo.result == 'success' || needs.prepare-cargo.result == 'skipped') && contains(needs.plan.outputs.units, '"unit_id":"rust-cloudflare-tofu-tools"') && ((!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot')))) }}
    needs: [plan, prepare-cargo]
    uses: ./.github/workflows/ci-unit-rust.yml
    with:
      unit: rust-cloudflare-tofu-tools
      provider: velnor
      selected_units: ${{ needs.plan.outputs.units }}
      selected_unit_ids: ${{ needs.plan.outputs.unit_ids }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      plan_digest: ${{ needs.plan.outputs.plan_digest }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
      mbx_enabled: true
      cargo_root: "."
      cargo_fetch_skip_when_warm: true
      cargo_net_offline: true
      host_warm_layers: "rustup,mold,mbx,cargo"
      unit_platform: linux-x64
      unit_trust: untrusted-ok
      unit_admission: velnor-trust-gated
      validation_phases: "fmt,clippy,test"
  ci-required:
    name: ci-required
    if: ${{ (!cancelled()) && (!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot'))) }}
    needs: [plan, velnor-opentofu, prepare-cargo, velnor-rust-cloudflare-tofu-tools]
    runs-on: [self-hosted, velnor-target-mvp]
    timeout-minutes: 5
    steps:
      - name: Download expected work
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: velnor-expected-work
          path: .velnor-ci-expected-work
      - name: Download reported unit results
        # A no-work plan runs no unit jobs, so zero result artifacts is the
        # expected case there — and the aggregate fails a real-work plan with
        # zero records anyway. Tolerate the empty download; never the verdict.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: velnor-result-*
          merge-multiple: true
          path: .velnor-ci-results
      - name: Collect reported unit results
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p .velnor-ci-results
          files=(.velnor-ci-results/result-*.json)
          for file in "${files[@]}"; do
            if jq -e 'any(.results[]?; has("reused_from"))' "$file" >/dev/null; then
              echo "::error::$file carries reused_from without a validate_reuse decision; render emits no reused results" >&2
              exit 1
            fi
          done
          if (( ${#files[@]} == 0 )); then
            printf '{"results":[]}\n' > .velnor-ci-results.json
          else
            jq -s '{results: ([.[].results // empty] | add // [])}' "${files[@]}" > .velnor-ci-results.json
          fi
          echo "collected $(jq '.results | length' .velnor-ci-results.json) reported result(s) from ${#files[@]} record file(s)"
      - name: Score expected work against reported results
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          velnor-workflow aggregate --expected .velnor-ci-expected-work/expected-work.json --results .velnor-ci-results.json
      - name: Validate generated stack results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SELECTED_UNITS: ${{ needs.plan.outputs.units }}
          PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
          EXCLUDED: ${{ needs.plan.outputs.excluded }}
          EXPECTED_CALLERS: "[{\"job_id\":\"velnor-opentofu\",\"provider\":\"velnor\",\"unit_id\":\"opentofu\"},{\"job_id\":\"velnor-rust-cloudflare-tofu-tools\",\"provider\":\"velnor\",\"unit_id\":\"rust-cloudflare-tofu-tools\"}]"
          PROVIDER_ADMITTED_VELNOR_TRUSTED: ${{ (!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot'))) }}
          PROVIDER_ADMITTED_ANY_LOCAL_TRUSTED: ${{ (!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot'))) }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PLAN_DIGEST" ]]; then
            echo "plan did not freeze a plan digest: the expected set has no identity" >&2
            exit 1
          fi
          echo "verdict binds plan digest $PLAN_DIGEST"
          result_for_job() {
            jq -r --arg job "$1" '.[$job].result // empty' <<<"$NEEDS_JSON"
          }
          plan_expects() {
            [[ "$(jq -r --arg unit "$1" --arg provider "$2" '[.[] | select(.unit_id == $unit) | .providers[] | select(. == $provider)] | length' <<<"$SELECTED_UNITS")" -gt 0 ]]
          }
          if ! jq -e --argjson expected "$EXPECTED_CALLERS" '($expected | type == "array") and all($expected[]; type == "object" and (.unit_id | type) == "string" and (.provider | type) == "string" and (.job_id | type) == "string")' -n; then
            echo "generated required-caller contract is malformed" >&2
            exit 1
          fi
          if ! jq -e --argjson expected "$EXPECTED_CALLERS" 'type == "array" and (map(.unit_id) | unique | length) == length and all(.[]; . as $entry | ($entry | type) == "object" and ($entry.unit_id | type) == "string" and ($entry.unit_id | length) > 0 and ($entry.providers | type) == "array" and ($entry.providers | length) > 0 and (($entry.providers | map(type == "string" and length > 0) | all)) and (($entry.providers | unique | length) == ($entry.providers | length)) and all($entry.providers[]; . as $provider | any($expected[]; .unit_id == $entry.unit_id and .provider == $provider)))' <<<"$SELECTED_UNITS" >/dev/null; then
            echo "plan selected-unit output contains an unknown, duplicate, empty, or unmapped obligation" >&2
            exit 1
          fi
          if ! jq -e 'type == "object"' <<<"$NEEDS_JSON" >/dev/null; then
            echo "workflow needs output is malformed" >&2
            exit 1
          fi
          plan_expects_local() {
            [[ "$(jq -r --arg unit "$1" '[.[] | select(.unit_id == $unit) | .providers[] | select(. == "velnor")] | length' <<<"$SELECTED_UNITS")" -gt 0 ]]
          }
          result="$(result_for_job plan)"
          if [[ "$result" != success ]]; then
            echo "required CI prerequisite plan did not pass: $result" >&2
            exit 1
          fi
          if plan_expects "opentofu" "velnor"; then
            result="$(result_for_job velnor-opentofu)"
            if [[ "$PROVIDER_ADMITTED_VELNOR_TRUSTED" == true ]]; then
              case "$result" in
                success) ;;
                skipped) echo "expected CI job velnor-opentofu was skipped: a skipped expected result cannot pass" >&2; exit 1 ;;
                cancelled) echo "expected CI job velnor-opentofu was cancelled: a cancelled expected result cannot pass" >&2; exit 1 ;;
                *) echo "expected CI job velnor-opentofu did not pass: $result" >&2; exit 1 ;;
              esac
            else
              case "$result" in
                skipped) ;;
                *) echo "selected CI job velnor-opentofu ran outside its provider admission (PROVIDER_ADMITTED_VELNOR_TRUSTED=$PROVIDER_ADMITTED_VELNOR_TRUSTED): $result" >&2; exit 1 ;;
              esac
            fi
          else
            result="$(result_for_job velnor-opentofu)"
            case "$result" in
              skipped) ;;
              success) echo "unexpected CI job velnor-opentofu succeeded outside the expected set: the plan did not declare it" >&2; exit 1 ;;
              *) echo "unexpected CI job velnor-opentofu ran outside the expected set: $result" >&2; exit 1 ;;
            esac
          fi
          if plan_expects_local "rust-cloudflare-tofu-tools"; then
            result="$(result_for_job prepare-cargo)"
            if [[ "$PROVIDER_ADMITTED_ANY_LOCAL_TRUSTED" == true ]]; then
              case "$result" in
                success) ;;
                skipped) echo "expected CI prerequisite prepare-cargo was skipped: a skipped expected result cannot pass" >&2; exit 1 ;;
                cancelled) echo "expected CI prerequisite prepare-cargo was cancelled: a cancelled expected result cannot pass" >&2; exit 1 ;;
                *) echo "expected CI prerequisite prepare-cargo did not pass: $result" >&2; exit 1 ;;
              esac
            else
              case "$result" in
                skipped) ;;
                *) echo "selected CI prerequisite prepare-cargo ran outside its provider admission (PROVIDER_ADMITTED_ANY_LOCAL_TRUSTED=$PROVIDER_ADMITTED_ANY_LOCAL_TRUSTED): $result" >&2; exit 1 ;;
              esac
            fi
          else
            result="$(result_for_job prepare-cargo)"
            case "$result" in
              skipped) ;;
              success) echo "unexpected CI prerequisite prepare-cargo succeeded outside the expected set: the plan did not declare it" >&2; exit 1 ;;
              *) echo "unexpected CI prerequisite prepare-cargo ran outside the expected set: $result" >&2; exit 1 ;;
            esac
          fi
          if plan_expects "rust-cloudflare-tofu-tools" "velnor"; then
            result="$(result_for_job velnor-rust-cloudflare-tofu-tools)"
            if [[ "$PROVIDER_ADMITTED_VELNOR_TRUSTED" == true ]]; then
              case "$result" in
                success) ;;
                skipped) echo "expected CI job velnor-rust-cloudflare-tofu-tools was skipped: a skipped expected result cannot pass" >&2; exit 1 ;;
                cancelled) echo "expected CI job velnor-rust-cloudflare-tofu-tools was cancelled: a cancelled expected result cannot pass" >&2; exit 1 ;;
                *) echo "expected CI job velnor-rust-cloudflare-tofu-tools did not pass: $result" >&2; exit 1 ;;
              esac
            else
              case "$result" in
                skipped) ;;
                *) echo "selected CI job velnor-rust-cloudflare-tofu-tools ran outside its provider admission (PROVIDER_ADMITTED_VELNOR_TRUSTED=$PROVIDER_ADMITTED_VELNOR_TRUSTED): $result" >&2; exit 1 ;;
              esac
            fi
          else
            result="$(result_for_job velnor-rust-cloudflare-tofu-tools)"
            case "$result" in
              skipped) ;;
              success) echo "unexpected CI job velnor-rust-cloudflare-tofu-tools succeeded outside the expected set: the plan did not declare it" >&2; exit 1 ;;
              *) echo "unexpected CI job velnor-rust-cloudflare-tofu-tools ran outside the expected set: $result" >&2; exit 1 ;;
            esac
          fi
  required:
    name: "Control / Required"
    if: ${{ (!cancelled()) && (!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot'))) }}
    needs: [ci-required]
    runs-on: [self-hosted, velnor-target-mvp]
    timeout-minutes: 5
    steps:
      - name: Mirror CI / Required
        if: ${{ needs.ci-required.result != 'success' }}
        run: exit 1
