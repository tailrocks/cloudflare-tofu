# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: Velnor workflow policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: policy-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: Policy
    if: ${{ github.event_name == 'pull_request_target' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) }}
    runs-on: [self-hosted, velnor-target-mvp]
    timeout-minutes: 20
    # Trust invariant: this job runs the base branch's Stage-0 validator
    # product against the audited tree under pull_request_target. It holds
    # `contents: read` only, references no secrets, persists no credentials,
    # and never compiles. When the audited tree differs from the declared
    # pin's render, it additionally EXECUTES the PR run's prebuilt
    # candidate generator — PR-built code, same-repository runs only, bound
    # to the audited tree by manifest closure plus binary digest before
    # execution — with no secret references, no persisted credentials, the
    # read-only github.token confined to the Acquire/Ruleset API steps,
    # and both candidate exec points tokenless.
    permissions:
      contents: read
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: policy-checkout
          fetch-depth: 0
          persist-credentials: false
      - name: Check out audited head
        working-directory: policy-checkout
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags "$GITHUB_SERVER_URL/$HEAD_REPOSITORY" "$HEAD_SHA"
          fi
          git checkout --quiet --detach "$HEAD_SHA"
      - name: Provision pinned Velnor workflow policy runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED_REVISION: 4dec6b9ec28b0d51cb370fd8f5d5401c6186adf0
          CHECKOUT_PATH: ${{ github.workspace }}/policy-checkout
        run: |
          set -euo pipefail
          if ! git -C "$CHECKOUT_PATH" cat-file -e "$PINNED_REVISION^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$PINNED_REVISION"
          fi
          listing="$(git -C "$CHECKOUT_PATH" ls-tree -r "$PINNED_REVISION" -- crates/velnor-workflow Cargo.toml Cargo.lock rust-toolchain.toml rust-toolchain .cargo)"
          test "$listing" != '' || { echo "::error::revision $PINNED_REVISION has no closure inputs" >&2; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then
            closure="$(printf '%s\nclosure-version:1\nfeatures:\nprofile:release\n' "$(LC_ALL=C sort <<<"$listing")" | sha256sum | awk '{print $1}')"
          else
            closure="$(printf '%s\nclosure-version:1\nfeatures:\nprofile:release\n' "$(LC_ALL=C sort <<<"$listing")" | shasum -a 256 | awk '{print $1}')"
          fi
          binary="${CARGO_HOME:-$HOME/.cargo}/bin/velnor-workflow-policy"
          tag="velnor-workflow-runtime-v1-${closure:0:16}"
          asset="velnor-workflow-${RUNNER_OS}-${RUNNER_ARCH}"
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          if ! gh release download "$tag" --repo tailrocks/velnor --pattern manifest.json --dir "$temporary"; then
            echo "::error::no policy runtime product for revision $PINNED_REVISION (closure ${closure:0:16}); the mainline runtime-product publisher builds it after merge" >&2
            exit 1
          fi
          gh attestation verify "$temporary/manifest.json" --owner tailrocks --signer-workflow tailrocks/velnor/.github/workflows/ci-runtime-products.yml
          jq -e --arg closure "$closure" --arg platform "${RUNNER_OS}-${RUNNER_ARCH}" --arg asset "$asset" '.closure == $closure and (.revision | test("^[0-9a-f]{40}$")) and .profile == "release" and .features == "" and (.products[$platform].binary | test("^[0-9a-f]{64}$")) and .products[$platform].asset == $asset' "$temporary/manifest.json" >/dev/null
          expected="$(jq -er --arg platform "${RUNNER_OS}-${RUNNER_ARCH}" '.products[$platform].binary' "$temporary/manifest.json")"
          existing=""
          if [[ -x "$binary" ]]; then
            if command -v sha256sum >/dev/null 2>&1; then
              existing="$(sha256sum "$binary" | awk '{print $1}')"
            else
              existing="$(shasum -a 256 "$binary" | awk '{print $1}')"
            fi
          fi
          if [[ "$existing" != "$expected" ]]; then
            gh release download "$tag" --repo tailrocks/velnor --pattern "$asset" --dir "$temporary"
            gh attestation verify "$temporary/$asset" --owner tailrocks --signer-workflow tailrocks/velnor/.github/workflows/ci-runtime-products.yml
            if command -v sha256sum >/dev/null 2>&1; then
              actual="$(sha256sum "$temporary/$asset" | awk '{print $1}')"
            else
              actual="$(shasum -a 256 "$temporary/$asset" | awk '{print $1}')"
            fi
            [[ "$actual" == "$expected" ]] || { echo "::error::policy runtime digest mismatch" >&2; exit 1; }
            install -Dm0755 "$temporary/$asset" "$binary"
          fi
          reported="$("$binary" --closure)"
          [[ "$reported" == "$closure" ]] || { echo "::error::pinned workflow policy runtime reports closure $reported, expected $closure" >&2; exit 1; }
          echo "VELNOR_WORKFLOW_PINNED_BINARY=$binary" >> "$GITHUB_ENV"
      - name: Enforce workflow policy
        env:
          WORKFLOW_ROOT: ${{ github.workspace }}/policy-checkout
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          VELNOR_WORKFLOW_POLICY_REVISION: 4dec6b9ec28b0d51cb370fd8f5d5401c6186adf0
        run: |
          set -euo pipefail
          velnor-workflow policy \
            --workflow-root "$WORKFLOW_ROOT" \
            --head-sha "$HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --candidate-manifest "${VELNOR_WORKFLOW_CANDIDATE_MANIFEST:-}" \

      - name: Set up actionlint
        run: mise --yes install actionlint@1.7.12
      - name: Lint caller workflows
        working-directory: policy-checkout
        env:
          MISE_NO_CONFIG: "1"
        run: mise exec actionlint@1.7.12 -- actionlint
