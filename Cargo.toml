[package]
name = "cloudflare-tofu-tools"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "export-dns"
path = "src/bin/export-dns.rs"

[dependencies]
anyhow = "1.0.100"
reqwest = { version = "0.12.24", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
